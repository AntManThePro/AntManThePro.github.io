<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0a0a0f"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="TRUTH"/>
<title>NEXUS Truth Packet</title>
<link rel="manifest" href="./manifest.webmanifest"/>
<link rel="icon" href="./icon.svg"/>
<style>
:root{--g:#00ff87;--c:#60efff;--p:#ff0080;--y:#ffcc00;--bg:#0a0a0f;--card:#111118;--line:#1e3a2f;--muted:#7aa89a;}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:#e8fff4;font-family:ui-sans-serif,system-ui,sans-serif}
body{padding-bottom:84px}.wrap{max-width:440px;margin:0 auto;padding:12px}
.stamp{display:flex;align-items:center;gap:10px}.stamp h1{margin:0;letter-spacing:.22em;font-size:22px;color:var(--g);text-shadow:0 0 12px #00ff8788}
.stamp p{margin:0;font-size:10px;letter-spacing:.14em;color:var(--c)}.op{font-size:10px;color:var(--p)}
.bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid #00ff8755;color:var(--g);border-radius:999px;padding:3px 8px;font-size:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
label{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;background:#0c0c12;border:1px solid #2a3d34;color:#e8fff4;border-radius:10px;padding:11px;font-size:16px}
textarea{min-height:72px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.act{width:100%;background:var(--g);color:#04140c;border:0;border-radius:10px;padding:13px;font-weight:800}
button.ghost{width:100%;background:transparent;border:1px solid #2a3d34;color:#9fe8c8;border-radius:10px;padding:12px}
.nav{position:fixed;left:0;right:0;bottom:0;background:#0c0c12ee;border-top:1px solid #1e3a2f;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(8px + env(safe-area-inset-bottom))}
.nav button{background:none;border:0;color:#6f8f82;font-size:10px;padding:8px 2px}.nav button.on{color:var(--g)}
.pane{display:none}.pane.on{display:block}
canvas{width:100%;height:220px;background:#07070b;border:1px dashed #1e3a2f;border-radius:10px;touch-action:none}
.check{display:flex;gap:8px;align-items:flex-start;margin:8px 0;font-size:13px}.check input{width:18px;height:18px}
.thumb{width:100%;height:120px;object-fit:cover;border-radius:8px}
.tag{display:inline-block;margin:2px;padding:2px 7px;border-radius:999px;font-size:10px;border:1px solid #2a3d34}
.tag.g{border-color:var(--g);color:var(--g)}.tag.c{border-color:var(--c);color:var(--c)}.tag.y{border-color:var(--y);color:var(--y)}.tag.p{border-color:var(--p);color:var(--p)}
.item{border:1px solid #1e3a2f;border-radius:10px;padding:8px;margin-bottom:8px}
.ok{color:var(--g)}.bad{color:var(--p)}.warn{color:var(--y)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#00ff87;color:#04140c;padding:10px 14px;border-radius:999px;font-weight:700;display:none}
</style></head><body>
<div class="wrap">
<header class="stamp"><svg width="40" height="40" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0a0a0f" stroke="#00ff87"/><circle cx="32" cy="32" r="19" fill="none" stroke="#60efff"/><path d="M20 42 L32 14 L44 42 M25.5 32 H38.5" fill="none" stroke="#00ff87" stroke-width="2.6"/><circle cx="32" cy="32" r="3.2" fill="#ff0080"/></svg>
<div><h1>NEXUS</h1><p>NExtended Xperimental USers</p><div class="op">DoubleA · AntManThePro</div></div></header>
<div class="bar"><span class="chip">TRUTH PACKET</span><span class="chip" id="libCount">0 SITES</span><span class="chip" id="gpsChip">GPS OFF</span></div>
<section id="p-site" class="pane on"><div class="card"><div style="font-size:11px;letter-spacing:.16em;color:#60efff">SITE</div>
<label>Legal / DBA</label><input id="name" placeholder="Restaurant name"/>
<label>Address / suite</label><input id="addr" placeholder="Street, suite, city"/>
<div class="row"><div><label>AHJ</label><input id="ahj" placeholder="Kyle / Buda / Dallas"/></div>
<div><label>Roof access</label><select id="access"><option>Unknown</option><option>Hatch</option><option>Ladder</option><option>Stairs</option><option>Locked door</option></select></div></div>
<label>GM / contact</label><input id="gm" placeholder="Name / phone"/>
<div class="row"><div><label>Hoods</label><input id="hoods" type="number" value="1"/></div><div><label>Fans</label><input id="fans" type="number" value="1"/></div></div>
<label>Duct feet est</label><input id="ductft" type="number" value="20"/>
<label>Tech</label><input id="tech" placeholder="Your name"/></div>
<button class="ghost" type="button" id="btnGps">Pin GPS now</button></section>
<section id="p-path" class="pane"><div class="card"><div style="font-size:11px;letter-spacing:.16em;color:#60efff">PATH</div>
<label>Hood → turns → fan</label><textarea id="path" placeholder="Hood A → 90R → fan"></textarea>
<label>Field schematic</label><canvas id="sk" width="800" height="440"></canvas>
<div class="row" style="margin-top:8px"><button class="ghost" type="button" id="undo">Undo</button><button class="ghost" type="button" id="markPanel">Pink panel</button></div>
<button class="ghost" type="button" id="clearSk" style="margin-top:8px">Clear sketch</button></div></section>
<section id="p-audit" class="pane"><div class="card"><div style="font-size:11px;letter-spacing:.16em;color:#60efff">NFPA 96 ACCESS</div><div id="checks"></div>
<label>Stamp</label><select id="stamp"><option value="FIELD_DRAWN">FIELD DRAWN</option><option value="ON_SITE">ON SITE</option><option value="PERMIT_PULLED">PERMIT SET</option><option value="MISSING">MISSING</option></select>
<label>Deficiencies</label><textarea id="def" placeholder="Missing panels / no drawing"></textarea></div></section>
<section id="p-photos" class="pane"><div class="card"><div style="font-size:11px;letter-spacing:.16em;color:#60efff">PHOTOS</div>
<label>JPEG preferred. HEIC often drops EXIF.</label>
<input id="files" type="file" accept="image/*" capture="environment" multiple/>
<div class="row" style="margin-top:8px"><button class="act" type="button" id="tagRoll">Tag roll</button><button class="ghost" type="button" id="clearPhotos">Clear roll</button></div>
<p style="font-size:11px;color:#7aa89a">On-device EXIF / GPS / metal-sky. No upload.</p><div id="photoOut"></div></div></section>
<section id="p-archive" class="pane"><div class="card"><div style="font-size:11px;letter-spacing:.16em;color:#60efff">ARCHIVE</div>
<div class="row"><button class="act" type="button" id="save">Save packet</button><button class="ghost" type="button" id="export">Export JSON</button></div>
<button class="ghost" type="button" id="print" style="margin-top:8px">Print packet</button>
<button class="ghost" type="button" id="wipe" style="margin-top:8px">Wipe local archive</button>
<div id="archive" style="margin-top:12px"></div></div></section>
</div>
<nav class="nav"><button class="on" data-p="p-site">SITE</button><button data-p="p-path">PATH</button><button data-p="p-audit">AUDIT</button><button data-p="p-photos">SHOTS</button><button data-p="p-archive">FILE</button></nav>
<div class="toast" id="toast">Saved</div>
<script src="./app.js"></script>
</body></html>
