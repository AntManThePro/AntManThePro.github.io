<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NEXUS EDITOR custom icon">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07070a"/>
      <stop offset="100%" stop-color="#0a1a12"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="50%" stop-color="#60efff"/>
      <stop offset="100%" stop-color="#00ff87"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- outer rounded square -->
  <rect x="8" y="8" width="496" height="496" rx="110" fill="url(#bgGrad)" stroke="#00ff87" stroke-width="8"/>
  <!-- inner frame -->
  <rect x="40" y="40" width="432" height="432" rx="80" fill="none" stroke="#60efff" stroke-width="4" opacity="0.6"/>
  <!-- code brackets with glow -->
  <g filter="url(#glow)">
    <path d="M160 180 L80 256 L160 332" fill="none" stroke="url(#neon)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M352 180 L432 256 L352 332" fill="none" stroke="url(#neon)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- live slash -->
    <path d="M300 160 L212 352" stroke="#ff0080" stroke-width="28" stroke-linecap="round"/>
  </g>
  <!-- live pulse dots -->
  <circle cx="400" cy="400" r="36" fill="#ff0080" opacity="0.9"/>
  <circle cx="400" cy="400" r="16" fill="#ffcc00"/>
  <circle cx="112" cy="112" r="18" fill="#00ff87" opacity="0.8"/>
</svg>
