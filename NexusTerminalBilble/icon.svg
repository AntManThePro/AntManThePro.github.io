<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87"/>
      <stop offset="45%" stop-color="#60efff"/>
      <stop offset="100%" stop-color="#ff0080"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="28" fill="#0a0e27"/>
  <!-- Outer neon ring -->
  <rect x="8" y="8" width="112" height="112" rx="22" stroke="url(#g)" stroke-width="3" fill="none" opacity="0.9"/>
  <!-- Terminal body -->
  <rect x="28" y="36" width="72" height="52" rx="6" fill="#111840" stroke="#60efff" stroke-width="2"/>
  <!-- Terminal top bar -->
  <rect x="28" y="36" width="72" height="12" rx="6" fill="#0d1233"/>
  <circle cx="38" cy="42" r="2.5" fill="#ff0080"/>
  <circle cx="48" cy="42" r="2.5" fill="#ffcc00"/>
  <circle cx="58" cy="42" r="2.5" fill="#00ff87"/>
  <!-- Prompt line -->
  <text x="36" y="66" font-family="monospace" font-size="11" font-weight="700" fill="#00ff87" filter="url(#glow)">nexus></text>
  <rect x="78" y="58" width="8" height="10" fill="#60efff" opacity="0.9">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <!-- Lock accent -->
  <path d="M64 88 v-6 a6 6 0 0 1 12 0 v6" stroke="#ff0080" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <rect x="62" y="88" width="16" height="12" rx="2" fill="#ff0080" opacity="0.9"/>
</svg>
